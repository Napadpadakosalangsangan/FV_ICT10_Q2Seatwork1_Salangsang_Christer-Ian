<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seatwork 1</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: white;
        margin: 20px;
    }

    .container {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid black;
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    p {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid gray;
    }

    button {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 10px;
        border: 1px solid black;
        background-color: white;
        color: black;
        cursor: pointer;
    }

    #result {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid gray;
        overflow-wrap: anywhere;
    }

    footer {
        margin-top: 25px;
        text-align: center;
        font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>PETER CLUB</h1>
    <p>Candidate Verification System</p>

    <label>First Name</label>
    <input type="text" id="Fname" placeholder="Enter your first name: ">

    <label>Last Name</label>
    <input type="text" id="Lname" placeholder="Enter your last name: ">

    <button id="verify" py-click="verification">VERIFY MEMBERSHIP</button>
      <div id="result"></div>
  
    <footer>
      Peter Club | Membership Verification System
    </footer>
  </div>


  <script type="py" src="main.py"></script>

</body>
</html>
